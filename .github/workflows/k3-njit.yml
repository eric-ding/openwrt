name: K3 OpenWrt + njit
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k3-njit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TZ: UTC
      BUILD_DIR: /mnt/k3-openwrt
    steps:
      - name: Checkout build inputs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Free unused hosted-runner toolchains
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          available=$(df --output=avail -BG /mnt | tail -1 | tr -dc "0-9")
          test "$available" -ge 30 || { echo "Need at least 30 GiB free"; exit 1; }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            curl ca-certificates zstd libelf-dev qemu-user autoconf automake \
            libtool pkg-config bzip2 xz-utils cpio time
          sudo install -d -o "$USER" -g "$(id -gn)" /mnt
          df -h /mnt
      - name: Prepare pinned source and K3 configuration
        run: bash scripts/firmware/prepare.sh "$BUILD_DIR"
      - name: Download verified build sources
        working-directory: /mnt/k3-openwrt
        run: |
          set -o pipefail
          make download -j4 V=s 2>&1 | tee download.log
      - name: Compile kernel, rootfs and njit from source
        working-directory: /mnt/k3-openwrt
        run: |
          set -o pipefail
          export SOURCE_DATE_EPOCH=$(python3 -c 'import json; print(json.load(open("k3-source-lock.json"))["source_date_epoch"])')
          make -j2 V=s 2>&1 | tee build.log
      - name: Verify and collect firmware
        run: python3 scripts/firmware/verify.py "$BUILD_DIR" "$GITHUB_WORKSPACE/build/k3-artifacts"
      - name: Upload verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k3-openwrt-25.12.6-njit-${{ github.run_number }}
          path: build/k3-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: k3-build-diagnostics-${{ github.run_number }}
          path: |
            /mnt/k3-openwrt/build.log
            /mnt/k3-openwrt/download.log
            /mnt/k3-openwrt/k3-defconfig.log
            /mnt/k3-openwrt/.config
            /mnt/k3-openwrt/k3-*.txt
            /mnt/k3-openwrt/logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
