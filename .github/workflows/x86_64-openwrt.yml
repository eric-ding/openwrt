name: OpenWrt x86_64 PVE side router
on:
  push:
    branches:
      - feature/x86_64-openclash
    paths:
      - '.github/workflows/x86_64-openwrt.yml'
      - 'config/x86_64/**'
      - 'scripts/firmware/prepare-x86_64.sh'
      - 'scripts/firmware/verify-x86_64.py'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/x86_64-openwrt.yml'
      - 'config/x86_64/**'
      - 'scripts/firmware/prepare-x86_64.sh'
      - 'scripts/firmware/verify-x86_64.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: openwrt-x86_64-openclash-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TZ: UTC
      BUILD_DIR: /mnt/openwrt-x86_64
    steps:
      - name: Checkout locked build inputs
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Check runner capacity
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          available=$(df --output=avail -BG /mnt | tail -1 | tr -dc '0-9')
          test "$available" -ge 30 || { echo 'Need at least 30 GiB free'; exit 1; }
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            curl ca-certificates zstd libelf-dev autoconf automake libtool \
            pkg-config bzip2 xz-utils cpio time
          sudo install -d -o "$USER" -g "$(id -gn)" /mnt
      - name: Prepare pinned OpenWrt and OpenClash sources
        run: bash scripts/firmware/prepare-x86_64.sh "$BUILD_DIR"
      - name: Download verified package sources
        working-directory: /mnt/openwrt-x86_64
        run: |
          set -o pipefail
          make download -j4 V=s 2>&1 | tee download.log
      - name: Build SeaBIOS x86_64 ext4 image with OpenClash
        working-directory: /mnt/openwrt-x86_64
        run: |
          set -o pipefail
          export SOURCE_DATE_EPOCH=$(python3 -c 'import json; print(json.load(open("x86_64-build-inputs.json"))["openwrt_source_date_epoch"])')
          make -j2 V=s 2>&1 | tee build.log
      - name: Verify and collect image
        run: python3 scripts/firmware/verify-x86_64.py "$BUILD_DIR" "$GITHUB_WORKSPACE/build/x86_64-artifacts"
      - name: Upload firmware artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openwrt-25.12.6-x86_64-seabios-openclash-${{ github.run_number }}
          path: build/x86_64-artifacts/
          if-no-files-found: error
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openwrt-x86_64-build-diagnostics-${{ github.run_number }}
          path: |
            /mnt/openwrt-x86_64/build.log
            /mnt/openwrt-x86_64/download.log
            /mnt/openwrt-x86_64/x86_64-defconfig.log
            /mnt/openwrt-x86_64/x86_64-diffconfig.txt
            /mnt/openwrt-x86_64/x86_64-build-inputs.json
          if-no-files-found: ignore
          retention-days: 14
