name: K3 OpenClash nft DNS dependency
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: k3-openclash-deps-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install cloud build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev curl ca-certificates zstd file autoconf automake libtool pkg-config flex bison qemu-user
      - name: Build ARM dnsmasq-full with nftset and without optional conntrack
        run: bash scripts/openclash/build-deps.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: k3-openclash-deps-${{ github.run_number }}
          path: build/openclash-deps-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: k3-openclash-deps-log-${{ github.run_number }}
          path: build/openclash-deps-build.log
          if-no-files-found: ignore
