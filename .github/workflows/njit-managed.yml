name: NJIT managed backend checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: njit-managed-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Install cloud build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev curl ca-certificates zstd file autoconf automake libtool pkg-config flex bison
      - name: Offline credential, frame and runtime tests
        run: bash scripts/njit/test-managed.sh
      - name: Build ARM package with pinned OpenWrt SDK
        run: bash scripts/njit/build-managed.sh
      - name: Upload experimental package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: njit-managed-experimental-${{ github.run_number }}
          path: build/njit-managed-artifacts/
          if-no-files-found: error
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: njit-managed-diagnostics-${{ github.run_number }}
          path: build/njit-managed-build.log
          if-no-files-found: ignore
